[project]
name = "video-uploader"
version = "0.1.0"
description = "Locally-run tool to publish a video to multiple social platforms."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlmodel>=0.0.22",
    "keyring>=25.0",
    "httpx>=0.27",
    "authlib>=1.3",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "cryptography>=43.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
video-uploader = "video_uploader.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_uploader"]

[tool.pytest.ini_options]
pythonpath = ["src"]
