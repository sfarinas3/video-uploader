# Copy this file to config.yaml (gitignored) and fill in your own values.
# App-level credentials (client ID/secret) registered by you on each
# platform's developer console. User OAuth tokens are NOT stored here —
# they live in the OS keychain via `keyring`.

server:
  host: 127.0.0.1
  port: 8000

storage:
  db_path: data/video_uploader.sqlite3
  upload_dir: data/uploads

# default_format is the format variant used when a job doesn't set one
# explicitly (e.g. "standard"/"shorts" for YouTube, "feed"/"reel"/"story"
# for Instagram). Leave blank to let the publisher auto-detect from the
# video instead (auto-detection lands in milestone 8).
platforms:
  # youtube.client_id/client_secret come from a Google Cloud Console OAuth
  # client (Web application type). Register this exact redirect URI there:
  #   http://127.0.0.1:8000/oauth/youtube/callback
  # (adjust host/port to match `server:` above if you change it).
  youtube:
    client_id: ""
    client_secret: ""
    default_format: "standard"
  # facebook.app_id/app_secret come from a Meta app (developers.facebook.com)
  # with two Use Cases added: "Manage everything on your Page" (adds
  # pages_show_list/pages_manage_posts/pages_read_engagement/
  # business_management) and "Manage messaging and content on Instagram"
  # (adds instagram_basic/instagram_content_publish -- add its "Manage
  # content on Instagram" permissions, not the messaging ones). Register
  # this exact redirect URI there (Facebook Login product settings):
  #   https://video-uploader.local:8443/oauth/facebook/callback
  # (Meta requires HTTPS for the redirect URI; see oauth_https_catcher.py
  # for why this uses a fake local domain instead of 127.0.0.1/localhost --
  # map it to 127.0.0.1 in your OS hosts file and register it as an App
  # Domain too).
  # page_id must be the numeric ID of the specific Page you want this tool
  # to publish to (you must be an admin of that Page) -- the connect flow
  # looks up that page's access token from the pages your account manages.
  # For Instagram publishing (see the instagram block below), that Page
  # must also have an Instagram Business account linked to it (Instagram
  # app -> Settings -> Linked accounts, or the Page's own Settings ->
  # Linked accounts).
  facebook:
    app_id: ""
    app_secret: ""
    page_id: ""
    default_format: ""
  # Instagram has no separate app credentials or connect flow -- it reuses
  # the Facebook app/connection above and auto-discovers the Instagram
  # Business account linked to that Page at connect time. The Facebook
  # OAuth scope already requested above includes instagram_basic and
  # instagram_content_publish for this reason.
  instagram:
    default_format: "feed"
  # tiktok.client_key/client_secret come from a TikTok Developer app
  # (developers.tiktok.com) with the Content Posting API product added,
  # Direct Post enabled, and the video.publish scope (not video.upload --
  # that only drops a draft in the user's inbox rather than actually
  # posting). Register this exact redirect URI there (reuses the same
  # HTTPS catcher and fake local domain as Facebook, see
  # oauth_https_catcher.py):
  #   https://video-uploader.local:8443/oauth/tiktok/callback
  # Unaudited apps can only post as private/self-view -- this tool
  # enforces that regardless of what's requested (DESIGN.md §3/§8), so
  # there's no App Review to pursue for v1.
  tiktok:
    client_key: ""
    client_secret: ""
    default_format: ""
